<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1C1A18">
<title>Bibliotheca</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%231C1A18'/><text x='50' y='65' font-size='50' text-anchor='middle' fill='%23C2A878' font-family='serif'>B</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:Georgia,serif;overflow:hidden;transition:background .5s,color .5s}
.theme-parchment{--bg:#F4F1EA;--text:#2C2825;--accent:#9C815E;--muted:#4A4541;--panel:#EAE5D9}
.theme-sepia{--bg:#E8DCC4;--text:#3A2E1F;--accent:#8B6F47;--muted:#6B5A42;--panel:#D4C4A8}
.theme-leather{--bg:#1C1A18;--text:#E3DFD5;--accent:#C2A878;--muted:#9C815E;--panel:#2A2624}
.theme-night{--bg:#141210;--text:#C8C2B4;--accent:#C2A878;--muted:#8A8376;--panel:#1C1A18}
body{background:var(--bg);color:var(--text)}
.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.active{display:flex}
button{background:none;border:none;color:inherit;cursor:pointer;font:inherit}
.header{padding:48px 24px 24px;border-bottom:1px solid color-mix(in srgb,var(--accent) 20%,transparent)}
.title-deco{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.title-deco .line{flex:1;height:1px;background:var(--accent)}
.title-deco .label{color:var(--accent);font-size:10px;letter-spacing:.3em;text-transform:uppercase;font-family:system-ui}
h1{font-size:32px;font-style:italic;color:var(--text)}
.subtitle{color:var(--muted);font-size:13px;margin-top:8px;font-family:system-ui}
.toolbar{display:flex;gap:8px;padding:16px 24px;flex-wrap:wrap}
.btn{padding:10px 16px;border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);color:var(--accent);font-family:system-ui;font-size:12px;letter-spacing:.1em;text-transform:uppercase;border-radius:2px;transition:all .2s}
.btn:hover,.btn:active{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.btn-primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.tabs{display:flex;gap:4px;padding:16px 24px;background:var(--panel)}
.tab{padding:8px 14px;font-family:system-ui;font-size:13px;color:var(--muted);border-radius:2px}
.tab.active{background:var(--accent);color:var(--bg)}
.books{flex:1;overflow-y:auto;padding:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:20px}
.book{cursor:pointer;text-align:left;transition:transform .2s}
.book:hover{transform:translateY(-2px)}
.cover{aspect-ratio:2/3;border-radius:2px;overflow:hidden;position:relative;background:linear-gradient(135deg,#1C1A18,#2A2624);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);box-shadow:0 4px 12px rgba(0,0,0,.15)}
.cover img{width:100%;height:100%;object-fit:cover}
.cover-placeholder{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px}
.cover-placeholder .line{width:40px;height:1px;background:var(--accent);margin:8px 0}
.cover-placeholder .t{font-size:12px;font-style:italic;color:#E3DFD5;text-align:center;line-clamp:4}
.cover::before{content:'';position:absolute;inset:0 0 0 0;width:8px;background:linear-gradient(to right,rgba(0,0,0,.4),transparent)}
.progress-badge{position:absolute;bottom:0;left:0;right:0;padding:8px;background:linear-gradient(to top,rgba(28,26,24,.9),transparent)}
.progress-badge .row{display:flex;justify-content:space-between;margin-bottom:4px}
.progress-badge .label{font-size:9px;color:var(--accent);text-transform:uppercase;letter-spacing:.1em;font-family:system-ui}
.progress-badge .value{font-size:13px;color:#E3DFD5;font-weight:600}
.progress-bar{height:2px;background:rgba(255,255,255,.2);border-radius:2px;overflow:hidden}
.progress-bar .fill{height:100%;background:var(--accent);transition:width .3s}
.book-title{font-size:13px;margin-top:8px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.book-author{font-size:11px;color:var(--muted);margin-top:4px;font-family:system-ui}
.empty{text-align:center;padding:80px 24px;color:var(--muted);font-style:italic;font-size:20px}

/* Reader */
.reader{position:fixed;inset:0;background:var(--bg);color:var(--text)}
.reader-content{flex:1;overflow:hidden;position:relative}
.page{position:absolute;inset:0;padding:60px 24px;overflow:hidden;font-size:18px;line-height:1.7;transition:transform .25s}
.topbar,.bottombar{position:absolute;left:0;right:0;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;transition:opacity .3s,transform .3s;z-index:10;background:linear-gradient(to bottom,var(--bg),transparent)}
.bottombar{top:auto;bottom:0;background:linear-gradient(to top,var(--bg),transparent)}
.hidden{opacity:0;pointer-events:none;transform:translateY(-8px)}
.bottombar.hidden{transform:translateY(8px)}
.topbar button,.bottombar button{color:var(--accent);padding:8px}
.chapter-title{font-style:italic;font-size:16px;flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 12px}
.progress-track{flex:1;height:2px;background:color-mix(in srgb,var(--muted) 30%,transparent);margin:0 12px;border-radius:2px;overflow:hidden}
.progress-track .fill{height:100%;background:var(--accent);transition:width .3s}
.info-row{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-family:system-ui;margin-top:8px}

/* Settings panel */
.settings-panel{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:2px solid color-mix(in srgb,var(--accent) 40%,transparent);padding:20px 24px 32px;z-index:20;transform:translateY(100%);transition:transform .3s;max-height:80vh;overflow-y:auto}
.settings-panel.open{transform:translateY(0)}
.settings-panel h3{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);margin-bottom:12px;font-family:system-ui}
.setting{margin-bottom:20px}
.setting-row{display:flex;justify-content:space-between;margin-bottom:8px;font-family:system-ui;font-size:12px;color:var(--muted)}
.setting-row .val{color:var(--accent);font-family:Georgia}
input[type=range]{width:100%;accent-color:var(--accent)}
.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.theme-btn{padding:8px;border:1px solid color-mix(in srgb,var(--accent) 20%,transparent);border-radius:2px;text-align:center;font-family:system-ui;font-size:10px;text-transform:uppercase;letter-spacing:.1em}
.theme-btn.active{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.theme-preview{aspect-ratio:3/4;border-radius:2px;margin-bottom:4px;border:1px solid rgba(0,0,0,.1)}

/* Selection menu */
.sel-menu{position:fixed;z-index:30;background:var(--bg);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:2px;box-shadow:0 8px 24px rgba(0,0,0,.3);padding:8px;min-width:200px}
.sel-menu button{display:flex;align-items:center;gap:10px;width:100%;padding:10px;font-family:system-ui;font-size:13px;text-align:left;border-radius:2px}
.sel-menu button:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.sel-preview{padding:8px 10px;border-bottom:1px solid color-mix(in srgb,var(--accent) 20%,transparent);margin-bottom:4px;font-style:italic;font-size:13px;color:var(--muted)}

/* Top panel */
.top-panel{position:fixed;top:0;left:0;right:0;max-height:80vh;background:var(--bg);border-bottom:2px solid color-mix(in srgb,var(--accent) 40%,transparent);z-index:20;transform:translateY(-100%);transition:transform .3s;display:flex;flex-direction:column}
.top-panel.open{transform:translateY(0)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);z-index:15;opacity:0;pointer-events:none;transition:opacity .3s}
.overlay.open{opacity:1;pointer-events:auto}
.tp-content{flex:1;overflow-y:auto;padding:16px 24px 32px}
.tp-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:2px;cursor:pointer;border-left:2px solid transparent}
.tp-item:hover{background:color-mix(in srgb,var(--accent) 5%,transparent)}
.tp-item.active{background:color-mix(in srgb,var(--accent) 10%,transparent);border-left-color:var(--accent)}
.tp-item .num{font-size:11px;color:var(--accent);width:24px}
.tp-item .t{flex:1;font-size:14px}
.tp-item.active .t{color:var(--accent);font-weight:600}

/* Toast */
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--accent);color:var(--bg);padding:10px 20px;border-radius:2px;font-family:system-ui;font-size:13px;opacity:0;transition:all .3s;z-index:50;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body class="theme-parchment">

<!-- LIBRARY SCREEN -->
<div id="library" class="screen active">
  <div class="header">
    <div class="title-deco"><div class="line"></div><div class="label">Bibliotheca</div><div class="line"></div></div>
    <h1>Моя библиотека</h1>
    <div class="subtitle" id="bookCount">0 томов</div>
  </div>
  <div class="toolbar">
    <button class="btn btn-primary" onclick="addBook()">+ Добавить том</button>
    <button class="btn" onclick="showTab('reading')">Читаю</button>
    <button class="btn" onclick="showTab('all')">Все</button>
  </div>
  <div class="books">
    <div id="booksGrid" class="grid"></div>
    <div id="emptyState" class="empty">Полки пусты...</div>
  </div>
  <input type="file" id="fileInput" accept=".epub,.fb2" style="display:none" onchange="handleFile(event)">
</div>

<!-- READER SCREEN -->
<div id="reader" class="screen reader">
  <div class="topbar hidden" id="topbar">
    <button onclick="closeReader()">←</button>
    <div class="chapter-title" id="chapterTitle">Глава 1</div>
    <button onclick="toggleSettings()">⚙</button>
  </div>
  <div class="reader-content" id="readerContent" onclick="handleReaderTap(event)">
    <div class="page" id="page"></div>
  </div>
  <div class="bottombar hidden" id="bottombar">
    <div style="flex:1">
      <div style="display:flex;align-items:center;gap:8px">
        <button onclick="prevChapter()" id="prevChBtn">←</button>
        <div class="progress-track"><div class="fill" id="progressFill"></div></div>
        <button onclick="nextChapter()" id="nextChBtn">→</button>
      </div>
      <div class="info-row" id="infoRow">
        <span>Стр. 1 / 1</span>
        <span>Глава 1 / 1</span>
      </div>
    </div>
  </div>
  <div class="overlay" id="overlay" onclick="closeAll()"></div>
  <div class="top-panel" id="topPanel">
    <div style="padding:16px 24px;border-bottom:1px solid color-mix(in srgb,var(--accent) 20%,transparent);display:flex;justify-content:space-between;align-items:center">
      <div class="title-deco" style="flex:1;margin:0"><div class="line"></div><div class="label">Навигация</div><div class="line"></div></div>
      <button onclick="closeAll()" style="color:var(--accent);padding:8px">✕</button>
    </div>
    <div class="tabs" id="panelTabs">
      <button class="tab active" onclick="switchPanelTab('toc',this)">Оглавление</button>
    </div>
    <div class="tp-content" id="panelContent"></div>
  </div>
  <div class="settings-panel" id="settingsPanel">
    <div style="display:flex;justify-content:space-between;margin-bottom:16px">
      <div class="title-deco" style="flex:1;margin:0"><div class="line"></div><div class="label">Настройки</div><div class="line"></div></div>
      <button onclick="toggleSettings()" style="color:var(--accent)">✕</button>
    </div>
    <div class="setting">
      <div class="setting-row"><span>Кегль</span><span class="val" id="fontSizeVal">18px</span></div>
      <input type="range" min="14" max="28" value="18" oninput="setFontSize(this.value)">
    </div>
    <div class="setting">
      <div class="setting-row"><span>Интервал</span><span class="val" id="lineHeightVal">1.7</span></div>
      <input type="range" min="1.4" max="2.2" step="0.1" value="1.7" oninput="setLineHeight(this.value)">
    </div>
    <div class="setting">
      <div class="setting-row"><span>Яркость</span><span class="val" id="brightnessVal">100%</span></div>
      <input type="range" min="40" max="100" value="100" oninput="setBrightness(this.value)">
    </div>
    <div class="setting">
      <h3>Цвет страницы</h3>
      <div class="themes">
        <button class="theme-btn active" onclick="setTheme('parchment',this)"><div class="theme-preview" style="background:#F4F1EA"></div>Пергамент</button>
        <button class="theme-btn" onclick="setTheme('sepia',this)"><div class="theme-preview" style="background:#E8DCC4"></div>Сепия</button>
        <button class="theme-btn" onclick="setTheme('leather',this)"><div class="theme-preview" style="background:#1C1A18"></div>Кожа</button>
        <button class="theme-btn" onclick="setTheme('night',this)"><div class="theme-preview" style="background:#141210"></div>Ночь</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============ STATE ============
let books = JSON.parse(localStorage.getItem('bibliotheca_books') || '[]');
let progress = JSON.parse(localStorage.getItem('bibliotheca_progress') || '{}');
let settings = JSON.parse(localStorage.getItem('bibliotheca_settings') || '{}');
let currentBook = null;
let currentChapter = 0;
let currentPage = 0;
let pages = [];
let uiVisible = false;

settings = {fontSize:18,lineHeight:1.7,brightness:100,theme:'parchment',...settings};

// ============ INIT ============
applySettings();
renderLibrary();

// ============ LIBRARY ============
function renderLibrary(){
  const grid = document.getElementById('booksGrid');
  const empty = document.getElementById('emptyState');
  document.getElementById('bookCount').textContent = books.length + ' том' + pluralize(books.length);
  if(books.length===0){grid.innerHTML='';empty.style.display='block';return}
  empty.style.display='none';
  grid.innerHTML = books.map(b=>{
    const p = progress[b.id]?.percent || 0;
    const cover = b.cover ? `<img src="${b.cover}">` : `<div class="cover-placeholder"><div class="line"></div><div class="t">${escapeHtml(b.title)}</div><div class="line"></div></div>`;
    const badge = p>0 ? `<div class="progress-badge"><div class="row"><span class="label">Прочитано</span><span class="value">${Math.round(p)}%</span></div><div class="progress-bar"><div class="fill" style="width:${p}%"></div></div></div>` : '';
    return `<div class="book" onclick="openBook('${b.id}')"><div class="cover">${cover}${badge}</div><div class="book-title">${escapeHtml(b.title)}</div>${b.author?`<div class="book-author">${escapeHtml(b.author)}</div>`:''}</div>`;
  }).join('');
}

function pluralize(n){const m=n%10,m2=n%100;if(m===1&&m2!==11)return'';if(m>=2&&m<=4&&(m2<10||m2>=20))return'а';return'ов'}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function addBook(){document.getElementById('fileInput').click()}

async function handleFile(e){
  const file = e.target.files[0];
  if(!file) return;
  showToast('Загрузка...');
  try{
    const buf = await file.arrayBuffer();
    const ext = file.name.split('.').pop().toLowerCase();
    let parsed;
    if(ext==='epub') parsed = await parseEpub(buf,file.name);
    else if(ext==='fb2') parsed = parseFb2(buf,file.name);
    else throw new Error('Формат не поддерживается');
    const id = 'b_'+Date.now();
    books.unshift({id,...parsed});
    localStorage.setItem('bibliotheca_books',JSON.stringify(books));
    // Сохраняем главы
    parsed.chapters.forEach((ch,i)=>{
      localStorage.setItem(`ch_${id}_${i}`,ch.html);
    });
    renderLibrary();
    showToast('Добавлено: '+parsed.title);
  }catch(err){
    showToast('Ошибка: '+err.message);
    console.error(err);
  }
  e.target.value='';
}

// ============ PARSERS ============
async function parseEpub(buf,fileName){
  const zip = await JSZip.loadAsync(buf);
  const containerXml = await zip.file('META-INF/container.xml').async('string');
  const containerDoc = new DOMParser().parseFromString(containerXml,'application/xml');
  const opfPath = containerDoc.querySelector('rootfile').getAttribute('full-path');
  const opfDir = opfPath.includes('/') ? opfPath.substring(0,opfPath.lastIndexOf('/')+1) : '';
  const opfXml = await zip.file(opfPath).async('string');
  const opfDoc = new DOMParser().parseFromString(opfXml,'application/xml');
  const title = opfDoc.querySelector('metadata title')?.textContent?.trim() || fileName.replace(/\.epub$/i,'');
  const author = opfDoc.querySelector('metadata creator')?.textContent?.trim() || '';
  const manifest = new Map();
  opfDoc.querySelectorAll('manifest item').forEach(it=>{
    manifest.set(it.getAttribute('id'),{href:it.getAttribute('href'),type:it.getAttribute('media-type')});
  });
  const spine = [];
  opfDoc.querySelectorAll('spine itemref').forEach(r=>spine.push(r.getAttribute('idref')));
  const chapters = [];
  for(let i=0;i<spine.length;i++){
    const item = manifest.get(spine[i]);
    if(!item || item.type!=='application/xhtml+xml') continue;
    const html = await zip.file(opfDir+item.href).async('string');
    const doc = new DOMParser().parseFromString(html,'application/xhtml+xml');
    const body = doc.body?.innerHTML || '';
    const chTitle = doc.querySelector('h1,h2,title')?.textContent?.trim() || `Глава ${i+1}`;
    chapters.push({title:chTitle,html});
  }
  let cover = null;
  const coverItem = Array.from(manifest.entries()).find(([id,v])=>id.toLowerCase().includes('cover')&&v.type.startsWith('image/'));
  if(coverItem){
    const f = zip.file(opfDir+coverItem[1].href);
    if(f) cover = `data:${coverItem[1].type};base64,${await f.async('base64')}`;
  }
  return {title,author,cover,chapters,totalWords:0};
}

function parseFb2(buf,fileName){
  let text = new TextDecoder('utf-8').decode(buf);
  let doc = new DOMParser().parseFromString(text,'application/xml');
  if(doc.querySelector('parsererror')){
    text = new TextDecoder('windows-1251').decode(buf);
    doc = new DOMParser().parseFromString(text,'application/xml');
  }
  const root = doc.documentElement;
  const ti = root.querySelector('description title-info');
  const title = ti?.querySelector('book-title')?.textContent?.trim() || fileName.replace(/\.fb2$/i,'');
  const an = ti?.querySelector('author');
  const author = an ? `${an.querySelector('first-name')?.textContent||''} ${an.querySelector('last-name')?.textContent||''}`.trim() : '';
  const binaryMap = new Map();
  root.querySelectorAll('binary').forEach(b=>{
    const id = b.getAttribute('id');
    const ct = b.getAttribute('content-type')||'image/jpeg';
    if(id) binaryMap.set(id,`data:${ct};base64,${b.textContent}`);
  });
  let cover = null;
  const cp = root.querySelector('description title-info coverpage image');
  if(cp){
    const href = cp.getAttribute('l:href')||cp.getAttribute('xlink:href');
    if(href?.startsWith('#')) cover = binaryMap.get(href.substring(1)) || null;
  }
  const chapters = [];
  root.querySelectorAll('body section').forEach((sec,idx)=>{
    const t = sec.querySelector(':scope > title');
    const chTitle = t?.textContent?.trim() || `Глава ${idx+1}`;
    let html = '';
    const convert = n=>{
      if(n.nodeType===3) return n.textContent||'';
      if(n.nodeType!==1) return '';
      const tag = n.tagName.toLowerCase();
      const ch = Array.from(n.childNodes).map(convert).join('');
      if(tag==='p') return `<p>${ch}</p>`;
      if(tag==='strong') return `<strong>${ch}</strong>`;
      if(tag==='emphasis') return `<em>${ch}</em>`;
      if(tag==='empty-line') return `<div style="height:1em"></div>`;
      if(tag==='cite'||tag==='epigraph') return `<blockquote>${ch}</blockquote>`;
      return ch;
    };
    for(const child of Array.from(sec.childNodes)){
      if(child.tagName?.toLowerCase()==='title' && child.parentElement===sec) continue;
      html += convert(child);
    }
    html = html.replace(/<image[^>]*l:href="#([^"]+)"[^>]*\/?>/g,(m,id)=>{
      const d = binaryMap.get(id);
      return d ? `<img src="${d}" style="max-width:100%;display:block;margin:1em auto">` : '';
    });
    chapters.push({title:chTitle,html});
  });
  return {title,author,cover,chapters,totalWords:0};
}

// ============ READER ============
function openBook(id){
  currentBook = books.find(b=>b.id===id);
  if(!currentBook) return;
  const p = progress[id] || {chapter:0,page:0};
  currentChapter = p.chapter || 0;
  currentPage = p.page || 0;
  document.getElementById('library').classList.remove('active');
  document.getElementById('reader').classList.add('active');
  loadChapter();
}

function closeReader(){
  saveProgress();
  document.getElementById('reader').classList.remove('active');
  document.getElementById('library').classList.add('active');
  renderLibrary();
}

function loadChapter(){
  const html = localStorage.getItem(`ch_${currentBook.id}_${currentChapter}`) || '';
  document.getElementById('chapterTitle').textContent = currentBook.chapters[currentChapter]?.title || '';
  paginate(html);
  updateUI();
}

function paginate(html){
  const page = document.getElementById('page');
  const content = document.getElementById('readerContent');
  page.style.fontSize = settings.fontSize+'px';
  page.style.lineHeight = settings.lineHeight;
  // Измеряем
  const measure = document.createElement('div');
  measure.style.cssText = `position:absolute;visibility:hidden;width:${content.offsetWidth-48}px;font-size:${settings.fontSize}px;line-height:${settings.lineHeight};font-family:Georgia,serif;padding:0`;
  measure.innerHTML = html;
  document.body.appendChild(measure);
  const pageHeight = content.offsetHeight - 120;
  const result = [];
  let current = '', currentH = 0;
  for(const child of Array.from(measure.children)){
    const h = child.offsetHeight;
    if(currentH + h > pageHeight && current){
      result.push(current);
      current = '';
      currentH = 0;
    }
    if(h > pageHeight){result.push(child.outerHTML);continue}
    current += child.outerHTML;
    currentH += h;
  }
  if(current) result.push(current);
  document.body.removeChild(measure);
  pages = result.length ? result : [html];
  if(currentPage >= pages.length) currentPage = 0;
  renderPage();
}

function renderPage(){
  document.getElementById('page').innerHTML = pages[currentPage] || '';
}

function updateUI(){
  const totalCh = currentBook.chapters.length;
  const percent = ((currentChapter + currentPage/Math.max(pages.length,1)) / totalCh) * 100;
  document.getElementById('progressFill').style.width = percent+'%';
  document.getElementById('infoRow').innerHTML = `<span>Стр. ${currentPage+1} / ${pages.length}</span><span>Глава ${currentChapter+1} / ${totalCh}</span>`;
  document.getElementById('prevChBtn').disabled = currentChapter===0;
  document.getElementById('nextChBtn').disabled = currentChapter===totalCh-1;
}

function handleReaderTap(e){
  if(e.target.closest('.topbar,.bottombar,.settings-panel,.top-panel,.sel-menu')) return;
  const rect = document.getElementById('readerContent').getBoundingClientRect();
  const x = (e.clientX||e.touches?.[0]?.clientX) - rect.left;
  const y = (e.clientY||e.touches?.[0]?.clientY) - rect.top;
  if(y < rect.height*0.15 || y > rect.height*0.85) return;
  if(x < rect.width*0.3) prevPage();
  else if(x > rect.width*0.7) nextPage();
  else toggleUI();
}

function toggleUI(){
  uiVisible = !uiVisible;
  document.getElementById('topbar').classList.toggle('hidden',!uiVisible);
  document.getElementById('bottombar').classList.toggle('hidden',!uiVisible);
}

function nextPage(){
  if(currentPage < pages.length-1){currentPage++;renderPage();updateUI();saveProgress()}
  else if(currentChapter < currentBook.chapters.length-1){nextChapter()}
}
function prevPage(){
  if(currentPage > 0){currentPage--;renderPage();updateUI();saveProgress()}
  else if(currentChapter > 0){prevChapter()}
}
function nextChapter(){
  if(currentChapter < currentBook.chapters.length-1){currentChapter++;currentPage=0;loadChapter();saveProgress()}
}
function prevChapter(){
  if(currentChapter > 0){currentChapter--;currentPage=0;loadChapter();saveProgress()}
}

function saveProgress(){
  if(!currentBook) return;
  const percent = ((currentChapter + currentPage/Math.max(pages.length,1)) / currentBook.chapters.length) * 100;
  progress[currentBook.id] = {chapter:currentChapter,page:currentPage,percent};
  localStorage.setItem('bibliotheca_progress',JSON.stringify(progress));
}

// ============ SETTINGS ============
function applySettings(){
  document.body.className = 'theme-'+settings.theme;
  document.getElementById('reader').style.filter = `brightness(${settings.brightness/100})`;
  const p = document.getElementById('page');
  if(p){p.style.fontSize=settings.fontSize+'px';p.style.lineHeight=settings.lineHeight}
  // Обновляем UI настроек
  document.getElementById('fontSizeVal').textContent = settings.fontSize+'px';
  document.getElementById('lineHeightVal').textContent = settings.lineHeight;
  document.getElementById('brightnessVal').textContent = settings.brightness+'%';
}

function setFontSize(v){settings.fontSize=+v;localStorage.setItem('bibliotheca_settings',JSON.stringify(settings));applySettings();paginate(localStorage.getItem(`ch_${currentBook.id}_${currentChapter}`)||'')}
function setLineHeight(v){settings.lineHeight=+v;localStorage.setItem('bibliotheca_settings',JSON.stringify(settings));applySettings();paginate(localStorage.getItem(`ch_${currentBook.id}_${currentChapter}`)||'')}
function setBrightness(v){settings.brightness=+v;localStorage.setItem('bibliotheca_settings',JSON.stringify(settings));applySettings()}
function setTheme(t,btn){settings.theme=t;localStorage.setItem('bibliotheca_settings',JSON.stringify(settings));document.querySelectorAll('.theme-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');applySettings()}

function toggleSettings(){
  const p = document.getElementById('settingsPanel');
  const o = document.getElementById('overlay');
  p.classList.toggle('open');
  o.classList.toggle('open');
  document.getElementById('topPanel').classList.remove('open');
}

function closeAll(){
  document.getElementById('settingsPanel').classList.remove('open');
  document.getElementById('topPanel').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}

// ============ TOP PANEL ============
function switchPanelTab(tab,btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  const content = document.getElementById('panelContent');
  if(tab==='toc'){
    content.innerHTML = currentBook.chapters.map((ch,i)=>`<div class="tp-item ${i===currentChapter?'active':''}" onclick="goToChapter(${i})"><span class="num">${String(i+1).padStart(2,'0')}</span><span class="t">${escapeHtml(ch.title)}</span></div>`).join('');
  }
}

function goToChapter(i){
  currentChapter = i;
  currentPage = 0;
  loadChapter();
  closeAll();
  saveProgress();
}

// ============ TABS ============
function showTab(t){
  const grid = document.getElementById('booksGrid');
  const filtered = t==='reading' ? books.filter(b=>progress[b.id]) : books;
  if(filtered.length===0){grid.innerHTML='';document.getElementById('emptyState').style.display='block';return}
  document.getElementById('emptyState').style.display='none';
  grid.innerHTML = filtered.map(b=>{
    const p = progress[b.id]?.percent || 0;
    const cover = b.cover ? `<img src="${b.cover}">` : `<div class="cover-placeholder"><div class="line"></div><div class="t">${escapeHtml(b.title)}</div><div class="line"></div></div>`;
    const badge = p>0 ? `<div class="progress-badge"><div class="row"><span class="label">Прочитано</span><span class="value">${Math.round(p)}%</span></div><div class="progress-bar"><div class="fill" style="width:${p}%"></div></div></div>` : '';
    return `<div class="book" onclick="openBook('${b.id}')"><div class="cover">${cover}${badge}</div><div class="book-title">${escapeHtml(b.title)}</div>${b.author?`<div class="book-author">${escapeHtml(b.author)}</div>`:''}</div>`;
  }).join('');
}

// ============ TOAST ============
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

// ============ SERVICE WORKER ============
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
